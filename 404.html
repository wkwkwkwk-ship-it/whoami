  <style>
/* =====================================================

/* ── SELF-HOSTED FONTS ── */
/* Inter variable font (weights 300–700, Latin only) */
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 300 700;
  font-display: swap;
  src: url(fonts/inter-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
/* Playfair Display 700 normal (Latin) */
@font-face {
  font-family: 'Playfair Display';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url(fonts/playfair-700.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
/* Playfair Display 400 italic (Latin) */
@font-face {
  font-family: 'Playfair Display';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url(fonts/playfair-400i.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── DARK THEME (default) ── */
:root {
  --bg:           #0c0c0d;
  --bg-2:         #111113;
  --bg-card:      #161618;
  --border:       #222224;
  --border-hover: #333336;
  --accent:       #c9a96e;
  --accent-light: rgba(201,169,110,0.12);
  --text:         #e8e8ea;
  --text-sub:     #8a8a90;
  --text-muted:   #55555c;
  --white:        #f5f5f7;
  --shadow:       0 4px 32px rgba(0,0,0,0.35);
  --font:         'Inter', system-ui, -apple-system, sans-serif;
  --serif:        'Playfair Display', Georgia, serif;
  --radius:       8px;
  --radius-lg:    14px;
  --max-w:        1080px;
  --ease:         cubic-bezier(0.4,0,0.2,1);
  --nav-h:        64px;
}

/* ── LIGHT THEME ── */
[data-theme="light"] {
  --bg:           #f5f4f1;
  --bg-2:         #edecea;
  --bg-card:      #ffffff;
  --border:       #e0dfdb;
  --border-hover: #c8c6c0;
  --accent:       #9e7a38;
  --accent-light: rgba(158,122,56,0.1);
  --text:         #1a1918;
  --text-sub:     #46443f;
  --text-muted:   #8a8880;
  --white:        #1a1918;
  --shadow:       0 4px 32px rgba(0,0,0,0.1);
}

/* ── BASE ── */
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
}
img { max-width: 100%; height: auto; display: block; }
a { color: inherit; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }

::selection { background: var(--accent-light); color: var(--accent); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
button:focus-visible, a:focus-visible { border-radius: var(--radius); }

/* ── UTILS ── */
.container { max-width: var(--max-w); margin: 0 auto; padding: 0 24px; }
.section-num { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; }

/* ── REVEAL (must be critical to prevent invisible-flash on DOMContentLoaded) ── */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s var(--ease), transform 0.6s var(--ease); }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ── NAVBAR ── */
#navbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: var(--nav-h);
  transition: background 0.3s, border-bottom 0.3s;
}
#navbar.scrolled {
  background: rgba(12,12,13,0.94);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
[data-theme="light"] #navbar.scrolled { background: rgba(245,244,241,0.94); }

.nav-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 24px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.nav-logo { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.18em; color: var(--accent); text-decoration: none; flex-shrink: 0; }

.nav-links {
  list-style: none;
  display: flex;
  align-items: center;
  gap: clamp(14px, 1.8vw, 28px);
  flex: 1;
  justify-content: center;
}
.nav-links a {
  font-size: 0.8rem; font-weight: 500; color: var(--text-sub);
  text-decoration: none; letter-spacing: 0.02em;
  transition: color 0.25s; white-space: nowrap;
  position: relative; padding-bottom: 2px;
}
.nav-links a::after {
  content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
  height: 1.5px; background: var(--accent);
  transform: scaleX(0); transform-origin: center;
  transition: transform 0.25s var(--ease);
}
.nav-links a:hover, .nav-links a.active { color: var(--white); }
.nav-links a.active::after { transform: scaleX(1); }
.nav-cta {
  background: var(--accent) !important; color: #000 !important;
  padding: 6px 16px; border-radius: var(--radius);
  font-weight: 600 !important; transition: opacity 0.2s !important;
}
.nav-cta:hover { opacity: 0.85; }

.nav-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.lang-switcher {
  display: flex; align-items: center; gap: 4px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 100px; padding: 4px 10px;
}
.lang-btn {
  background: none; border: none; cursor: pointer;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
  color: var(--text-muted); padding: 2px 4px;
  border-radius: 4px; transition: color 0.2s;
  font-family: var(--font);
}
.lang-btn.active { color: var(--accent); }
.lang-btn:hover:not(.active) { color: var(--text); }
.lang-sep { font-size: 0.65rem; color: var(--border-hover); }

.theme-toggle {
  width: 34px; height: 34px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-sub); transition: all 0.25s;
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
.icon-sun, .icon-moon { transition: opacity 0.2s; }
[data-theme="dark"]  .icon-sun  { display: none; }
[data-theme="dark"]  .icon-moon { display: block; }
[data-theme="light"] .icon-sun  { display: block; }
[data-theme="light"] .icon-moon { display: none; }

.nav-toggle {
  display: none; flex-direction: column; gap: 5px;
  background: none; border: none; cursor: pointer;
  padding: 6px; width: 34px; height: 34px;
  align-items: center; justify-content: center;
}
.nav-toggle span {
  display: block; width: 20px; height: 1.5px;
  background: var(--text); border-radius: 1px;
  transition: transform 0.3s, opacity 0.3s;
  transform-origin: center;
}
.nav-toggle.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.nav-toggle.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.nav-toggle.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

.nav-mobile {
  display: none;
  position: fixed;
  top: var(--nav-h); left: 0; right: 0;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 20px 24px 28px;
  z-index: 199;
  flex-direction: column;
  gap: 4px;
  box-shadow: var(--shadow);
  animation: slideDown 0.25s var(--ease);
}
.nav-mobile.open { display: flex; }
@keyframes slideDown { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
.nav-mobile a {
  font-size: 1rem; font-weight: 500; color: var(--text-sub);
  text-decoration: none; padding: 12px 0;
  border-bottom: 1px solid var(--border);
  transition: color 0.2s;
}
.nav-mobile a:last-child { border-bottom: none; }
.nav-mobile a:hover { color: var(--accent); }

/* ── HERO (homepage LCP) ── */
#hero {
  min-height: 100svh;
  display: flex; flex-direction: column; justify-content: center;
  padding: var(--nav-h) 24px 0;
  background:
    radial-gradient(ellipse 60% 40% at 80% 10%, var(--accent-light) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 10% 80%, rgba(201,169,110,0.04) 0%, transparent 60%),
    var(--bg);
}
.hero-inner {
  max-width: var(--max-w); margin: 0 auto; width: 100%;
  display: grid; grid-template-columns: 1fr 340px;
  gap: 64px; align-items: center;
}
.hero-eyebrow {
  font-size: 0.72rem; font-weight: 500; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 20px; display: block; transition-delay: 0.05s;
}
.hero-headline {
  font-family: var(--serif);
  font-size: clamp(2.8rem, 6vw, 4.6rem);
  font-weight: 700; line-height: 1.08;
  color: var(--white); margin-bottom: 24px;
  letter-spacing: -0.02em; transition-delay: 0.1s;
}
.hero-headline em { font-style: italic; color: var(--accent); }
.hero-desc {
  font-size: clamp(0.9rem, 1.5vw, 1rem);
  color: var(--text-sub); max-width: 480px;
  line-height: 1.78; margin-bottom: 36px; transition-delay: 0.18s;
}
.hero-desc strong { color: var(--text); font-weight: 600; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; transition-delay: 0.24s; }

.btn-primary {
  display: inline-flex; align-items: center;
  background: var(--accent); color: #000;
  font-size: 0.85rem; font-weight: 700;
  padding: 12px 22px; border-radius: var(--radius);
  text-decoration: none; letter-spacing: 0.02em;
  transition: opacity 0.2s, transform 0.2s; border: none; cursor: pointer;
}
.btn-primary:hover { opacity: 0.87; transform: translateY(-1px); }
.btn-ghost {
  display: inline-flex; align-items: center;
  background: transparent; color: var(--text-sub);
  font-size: 0.85rem; font-weight: 500;
  padding: 12px 22px; border-radius: var(--radius);
  border: 1px solid var(--border); text-decoration: none;
  transition: border-color 0.2s, color 0.2s;
}
.btn-ghost:hover { border-color: var(--border-hover); color: var(--white); }

.hero-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-top: 2px solid var(--accent);
  border-radius: var(--radius-lg);
  overflow: hidden; padding: 0;
  transition-delay: 0.15s;
}
.hero-photo {
  display: block; width: 100%;
  aspect-ratio: 4 / 5;
  object-fit: cover; object-position: center top;
}
.hero-meta { padding: 20px 24px 24px; }
.meta-item { padding: 10px 0; }
.meta-label { display: block; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 3px; }
.meta-value { display: block; font-size: 0.84rem; font-weight: 500; color: var(--text); }
.meta-divider { height: 1px; background: var(--border); }

/* ── SCROLL PROGRESS BAR ── */
#progress-bar {
  position: fixed; top: 0; left: 0;
  height: 2px; width: 0%;
  background: var(--accent);
  z-index: 999;
  transition: width 0.08s linear;
  pointer-events: none;
}

/* ── BLOG CATEGORY BADGE (used in article header) ── */
.blog-cat {
  display: inline-block; font-size: 0.62rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--accent); background: var(--accent-light);
  border: 1px solid rgba(201,169,110,0.2);
  padding: 3px 9px; border-radius: 4px; width: fit-content;
}

/* ── INDIVIDUAL ARTICLE PAGE HEADER (blog post LCP) ── */
.article-page-header {
  padding: calc(var(--nav-h) + 56px) 0 56px;
  background:
    radial-gradient(ellipse 50% 60% at 85% 10%, var(--accent-light) 0%, transparent 60%),
    var(--bg);
  border-bottom: 1px solid var(--border);
}
.article-back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.78rem; font-weight: 500; color: var(--text-muted);
  text-decoration: none; margin-bottom: 32px;
  transition: color 0.2s;
}
.article-back:hover { color: var(--accent); }
.article-header-cat { margin-bottom: 16px; }
.article-title-main {
  font-family: var(--serif);
  font-size: clamp(1.8rem, 3.5vw, 2.8rem);
  font-weight: 700; line-height: 1.15;
  color: var(--white); letter-spacing: -0.02em;
  margin-bottom: 20px; max-width: 720px;
}
.article-byline {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 0.78rem; color: var(--text-muted);
}
.article-byline-sep { color: var(--border-hover); }
.article-byline-author { color: var(--text-sub); font-weight: 500; }

.article-hero-image {
  width: 100%;
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 0 24px;
}
.article-hero-image img {
  width: 100%;
  max-height: 480px;
  object-fit: cover;
  border-radius: var(--radius-lg);
  display: block;
}

/* ── BLOG PAGE HERO (blog index LCP) ── */
.blog-page-hero {
  padding: calc(var(--nav-h) + 64px) 0 64px;
  background:
    radial-gradient(ellipse 50% 60% at 85% 10%, var(--accent-light) 0%, transparent 60%),
    var(--bg);
  border-bottom: 1px solid var(--border);
}
.blog-page-hero .container { max-width: var(--max-w); margin: 0 auto; }
.blog-page-eyebrow { display: block; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
.blog-page-headline { font-family: var(--serif); font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 700; color: var(--white); line-height: 1.12; letter-spacing: -0.02em; margin-bottom: 14px; }
.blog-page-desc { font-size: 0.94rem; color: var(--text-sub); max-width: 520px; line-height: 1.72; }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  :root { --nav-h: 60px; }
  .container { padding: 0 20px; }
  .nav-links { display: none; }
  .nav-toggle { display: flex; }
  .hero-inner { grid-template-columns: 1fr; gap: 36px; }
}
@media (max-width: 600px) {
  :root { --nav-h: 56px; }
  .hero-headline { font-size: 2.6rem; }
  .lang-switcher { padding: 3px 8px; }
  .lang-btn { font-size: 0.68rem; }
}
</style>
